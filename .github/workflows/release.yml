name: Релиз панели

# Тег vX.Y.Z (версия = src-tauri/tauri.conf.json) → установщик, портативный exe и latest.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Тесты
        run: cargo test -p mc-admin-panel --lib
      - name: Сборка
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_NOTES: Обновление MC Admin Panel. Подробности — на странице релиза.
        run: node scripts/release.mjs panel
      - name: Публикация
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" release/panel/* --title "MC Admin Panel $v" --latest --notes "**MCAdminPanel-$v-Setup.exe** — установщик, обновляется автоматически.
          **MCAdminPanel-$v-Portable.exe** — без установки, данные хранятся рядом с exe."


  android:
    needs: release
    uses: ./.github/workflows/android.yml
    secrets: inherit

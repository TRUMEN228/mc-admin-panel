name: Проверка

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Синтаксис интерфейса
        shell: bash
        run: for f in ui/js/*.js collector/ui/js/*.js; do node --check "$f"; done
      - name: Тесты Rust
        run: cargo test --workspace --lib

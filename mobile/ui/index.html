<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MC Admin Mobile</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">
<style>
  body { overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; font-size: 15px; }
  .theme-pick { grid-template-columns: repeat(2, 1fr); }
  .mob { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding-top: env(safe-area-inset-top); }
  .m-top { display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px; }
  .m-top h1 { margin: 0; font: 600 21px var(--font-display); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-top .sub { font-size: 12.5px; color: var(--text-3); display: flex; align-items: center; gap: 6px; }
  .m-body { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
  .m-body.fill { display: flex; flex-direction: column; overflow: hidden; }
  .m-nav { display: flex; border-top: 1px solid var(--border); background: var(--card); padding-bottom: env(safe-area-inset-bottom); }
  .m-nav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 10px; font-size: 11.5px; color: var(--text-3); text-decoration: none !important; }
  .m-nav a.on { color: var(--accent-fg); }
  .m-nav .ic { width: 22px; height: 22px; }
  button, .btn { height: 42px; border-radius: 10px; font-size: 15px; }
  button.sm { height: 34px; font-size: 13.5px; }
  input, select { height: 44px; font-size: 16px; border-radius: 10px; }
  .srv { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .s-ico { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex-shrink: 0; display: grid; place-items: center; background: var(--card-2); color: var(--text-3); }
  .s-ico img { width: 100%; height: 100%; image-rendering: pixelated; }
  .srv .t { font: 600 16.5px var(--font-display); }
  .meters { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .meters div { background: var(--card-2); border-radius: 9px; padding: 7px 10px; font-size: 12px; color: var(--text-3); }
  .meters b { display: block; color: var(--text); font-size: 15px; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
  .metrics .metric { padding: 9px 12px 6px; min-height: 0; }
  .metrics .metric .k { font-size: 12px; }
  .metrics .metric .v { font-size: 19px; }
  .metrics .metric .v small { font-size: 12px; }
  .metrics .spark { height: 26px; margin-top: 4px; }
  .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .seg { width: 100%; }
  .seg button { flex: 1; height: 34px; }
  .log { flex: 1; min-height: 0; background: var(--console-bg); border-radius: 12px; padding: 10px; font: 11.5px/1.5 var(--mono); color: var(--console-text); overflow: auto; white-space: pre-wrap; word-break: break-word; user-select: text; }
  .log .w { color: #fbbf24; } .log .e { color: #f87171; } .log .c { color: #60a5fa; } .log .p { color: #4ade80; } .log .j { color: #c4b5fd; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; flex-shrink: 0; }
  .chips button { height: 32px; font-size: 13px; flex-shrink: 0; }
  .cmd { display: flex; gap: 8px; flex-shrink: 0; }
  .cmd input { font-family: var(--mono); }
  .conn { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .conn.on { background: var(--accent); }
  .modal { width: 100%; }
  .overlay { padding: 12px; align-items: end; }
  .toasts { left: 12px; right: 12px; top: auto; bottom: 80px; }
  .toast { min-width: 0; max-width: none; }
  .hero { text-align: center; padding: 40px 8px 20px; }
  .hero .logo { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px; display: grid; place-items: center; background: var(--grad); color: #fff; box-shadow: 0 10px 30px -10px var(--glow); }
  .hero .logo .ic { width: 36px; height: 36px; }
  .big-btn { width: 100%; height: 50px; font-size: 16px; margin-top: 10px; }
  .scan { display: none; }
  html.scanning, html.scanning body { background: transparent !important; }
  html.scanning .mob, html.scanning .toasts { visibility: hidden; }
  html.scanning .scan { display: flex; position: fixed; inset: 0; z-index: 50; flex-direction: column; align-items: center; justify-content: space-between; padding: calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 32px); color: #fff; }
  .scan p, .scan button { position: relative; z-index: 1; }
  .scan p { margin: 0; font-size: 16px; text-align: center; text-shadow: 0 1px 6px #000a; }
  .scan .frame { width: 70vw; height: 70vw; max-width: 320px; max-height: 320px; border-radius: 24px; box-shadow: 0 0 0 100vmax #0009; outline: 3px solid #4ade80; }
  .scan button { width: 100%; max-width: 360px; height: 50px; background: #fff; color: #111; border: 0; font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<div class="mob" id="m">
  <header class="m-top" id="top"></header>
  <main class="m-body" id="body"></main>
  <nav class="m-nav" id="nav"></nav>
</div>
<div class="toasts" id="toasts"></div>
<div class="scan"><p>Наведите камеру на QR-код в панели</p><div class="frame"></div><button onclick="scanCancel()">Отмена</button></div>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>

[package]
name = "mccore"
version = "0.1.0"
edition = "2021"
description = "Общий код MC Admin Panel и MC Mod Collector: каталоги модов, превью, сборки .mrpack"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
futures-util = "0.3"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1_smol = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
urlencoding = "2"

[package]
name = "mc-admin-panel"
version = "2.5.1"
description = "Админ-панель для создания и управления серверами Minecraft"
edition = "2021"
rust-version = "1.80"

[lib]
name = "mc_admin_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mccore = { path = "../crates/mccore" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
futures-util = "0.3"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk"] }
sha1_smol = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
urlencoding = "2"
sha2 = "0.10"
md-5 = "0.10"
fastnbt = "2"
flate2 = "1"
hex = "0.4"
getrandom = "0.2"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

